<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DIVINOS GAMES V12.6 PER PRODUTO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter;background:#0a0f24;color:#fff;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:rgba(8,8,16,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,229,255,.15);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:Orbitron;font-weight:900;font-size:18px;color:#00e5ff;cursor:pointer}.logo span{color:#a855f7}

.btn{padding:9px 12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:11px}.btn-primary{background:linear-gradient(135deg,#00e5ff,#7c3aed);color:#000}.btn-cart{background:#11112a;border:1px solid #00e5ff30;color:#fff;position:relative}
.cart-count{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:9px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hero{position:relative;height:340px;border-radius:16px;margin:14px;overflow:hidden;border:1px solid rgba(0,229,255,.2);background:#000}
.hero-bg{position:absolute;inset:0;background:linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 50%, rgba(0,0,0,.2) 100%), url('https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=1200&h=600&fit=crop') center/cover no-repeat}
.hero-content{position:relative;z-index:2;padding:30px 20px;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.catalogs{display:flex;gap:10px;overflow:auto;padding:16px 14px;background:rgba(10,15,36,.6);border-top:1px solid rgba(0,229,255,.08);border-bottom:1px solid rgba(255,255,255,.06)}.catalog-btn{background:linear-gradient(180deg, rgba(22,22,45,.95) 0%, rgba(12,12,25,.95) 100%);border:1px solid rgba(255,255,255,.12);color:#c8c8d8;padding:12px 18px;border-radius:14px;font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}.catalog-btn.active{background:linear-gradient(135deg, rgba(0,229,255,.16) 0%, rgba(124,58,237,.20) 100%);border:1px solid #00e5ff;color:#00e5ff}

.products{padding:10px 14px}.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:900px){.products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:linear-gradient(180deg, rgba(18,18,40,.9) 0%, rgba(10,10,20,.95) 100%);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;cursor:pointer}.product-card.oferta-topo{border:2px solid #facc15;box-shadow:0 0 20px rgba(250,204,21,.35)}
.product-img-wrap{position:relative;height:140px;background:#000}.product-img{width:100%;height:100%;object-fit:contain}.product-badge{position:absolute;top:8px;left:8px;padding:4px 8px;border-radius:20px;font-size:8px;font-weight:900}.badge-oferta-dia{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.product-info{padding:10px}.product-name{font-size:11px;font-weight:700;height:28px;overflow:hidden}.product-price{font-family:Orbitron;font-size:14px;font-weight:900;color:#00e5ff;margin-top:4px}
.product-actions{display:flex;gap:6px;margin-top:8px}.btn-small{flex:1;padding:7px;border-radius:8px;border:none;font-weight:800;font-size:10px;cursor:pointer}.btn-buy{background:linear-gradient(135deg,#00e5ff,#7c3aed);color:#000}.btn-details{background:#11112a;border:1px solid #1f2937;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00e5ff;color:#000;padding:10px 18px;border-radius:20px;font-weight:900;display:none;z-index:9999}
.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:200}.cart-box{background:#121228;border:1px solid #00e5ff30;border-radius:16px 16px 0 0;max-width:500px;width:100%;max-height:80vh;overflow:auto;padding:16px}
.preview-modal-client{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;padding:14px}
#adminSecretModal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99999}
</style></head><body>
<div class="header"><div class="logo" id="logoDivinos">🎮 DIVINOS <span>GAMES</span></div><div class="search"><input id="searchInput" placeholder="Buscar..." oninput="filtrar()"><button class="btn btn-primary" onclick="filtrar()">🔍</button></div><button class="btn-cart" onclick="abrirCarrinho()">🛒 <span id="cartCount">0</span></button></div>
<div class="hero" id="hero"><div class="hero-bg" id="heroBg"></div><div class="hero-content"><div style="font-family:Orbitron;font-size:28px;font-weight:900">DIVINOS <span style="color:#00e5ff">GAMES</span></div><div style="margin-top:12px"><button class="btn btn-primary" onclick="document.getElementById('produtosSection').scrollIntoView({behavior:'smooth'})">🎮 Ver Produtos</button></div></div></div>
<div class="catalogs"><button class="catalog-btn active" onclick="selecionarCatalogo('todos',this)">🎮 Todos</button><button class="catalog-btn" onclick="selecionarCatalogo('Console',this)">💎 Consoles</button><button class="catalog-btn" onclick="selecionarCatalogo('Jogo',this)">🎯 Jogos</button><button class="catalog-btn" onclick="selecionarCatalogo('Controle',this)">🎮 Controles</button><button class="catalog-btn" onclick="selecionarCatalogo('Acessório',this)">🔌 Acessórios</button><button class="catalog-btn" onclick="selecionarCatalogo('Manutenção',this)">🔧 Manutenção</button></div>
<div class="subcatalogs" id="subConsoles"><button class="sub-btn" onclick="filtrarSub('PS5',this)">PS5</button><button class="sub-btn" onclick="filtrarSub('Xbox',this)">Xbox</button></div>
<div class="subcatalogs" id="subJogos"><button class="sub-btn" onclick="filtrarSub('Ação',this)">Ação</button><button class="sub-btn" onclick="filtrarSub('FPS',this)">FPS</button></div>
<div class="subcatalogs" id="subManutencao"><button class="sub-btn" onclick="filtrarSub('Limpeza',this)">Limpeza</button></div>
<div class="products" id="produtosSection"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><div style="font-family:Orbitron;font-weight:900">🎮 Produtos - <span id="prodCount">0</span></div><div style="font-size:10px;opacity:.6">V12.6 Por Produto</div></div><div class="products-grid" id="productsGrid"></div></div>
<div class="toast" id="toast"></div>
<div class="cart-modal" id="cartModal"><div class="cart-box"><div style="display:flex;justify-content:space-between"><div style="font-weight:900">🛒 Carrinho</div><button class="btn" onclick="fecharCarrinho()">❌</button></div><div id="cartItems" style="margin-top:10px"></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:900"><div>Total:</div><div id="cartTotal">R$ 0</div></div><button class="btn btn-primary" style="width:100%;margin-top:12px;padding:12px" onclick="finalizarWhats()">💬 Whats</button></div></div>
<div class="preview-modal-client" id="previewModalClient"><div style="background:#121228;border:1px solid #00e5ff60;border-radius:16px;max-width:420px;width:100%;overflow:hidden;position:relative"><button onclick="fecharPreviewClient()" style="position:absolute;top:10px;right:10px;background:#1a0a14;border:1px solid #ef444440;color:#ff6b8a;width:32px;height:32px;border-radius:50%">✕</button><img id="previewClientImg" style="width:100%;height:280px;object-fit:contain;background:#000"><div style="padding:14px"><div id="previewClientBadge"></div><div id="previewClientNome" style="font-weight:900;margin-top:8px"></div><div id="previewClientPreco" style="font-family:Orbitron;font-size:18px;color:#00e5ff;margin-top:8px"></div><div id="previewClientParcela" style="font-size:10px;opacity:.6"></div><div id="previewPagamentoBox" style="margin-top:12px;background:#0f0f1f;border:1px solid #1f2937;border-radius:12px;padding:10px"><label style="display:flex;gap:8px;padding:10px;background:#11112a;border:1px solid #00e5ff60;border-radius:10px;margin-bottom:6px"><input type="radio" name="pagamentoPreview" value="avista" checked><span style="font-size:12px">💰 À Vista - <span id="previewAvista" style="color:#22c55e;font-weight:900"></span> <small id="previewAvistaDesc"></small></span></label><label style="display:flex;gap:8px;padding:10px;background:#0a0a1a;border:1px solid #1f2937;border-radius:10px"><input type="radio" name="pagamentoPreview" value="parcelado"><span style="font-size:12px">💳 Parcelado - <span id="previewParcelado"></span></span></label></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn-small btn-buy" style="flex:1;padding:12px" onclick="comprarDoPreview()">🛒 Comprar</button><button class="btn-small btn-details" style="flex:1;padding:12px" onclick="zapDoPreview()">💬 Zap</button></div></div></div></div>
<div id="adminSecretModal"><div style="background:#121228;border:1px solid #00e5ff60;border-radius:16px;padding:22px;width:90%;max-width:320px;text-align:center"><div style="font-weight:900;color:#00e5ff">🔒 ADMIN</div><input id="adminSecretPass" type="password" placeholder="••••" style="width:100%;padding:12px;border-radius:10px;margin:14px 0;background:#0a0a1a;border:1px solid #333;color:#fff;text-align:center"><div style="display:flex;gap:8px"><button onclick="document.getElementById('adminSecretModal').style.display='none'" style="flex:1;padding:12px;border-radius:10px;background:#11112a;border:1px solid #333;color:#fff">Cancelar</button><button onclick="checkSecretAdmin()" style="flex:1;padding:12px;border-radius:10px;background:linear-gradient(135deg,#00e5ff,#7c3aed);border:none;font-weight:900">ENTRAR</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCUL-tD4pPp7GEExJD08mEHdVzp-fbBxfs",authDomain:"divinosgames-63867.firebaseapp.com",projectId:"divinosgames-63867",storageBucket:"divinosgames-63867.firebasestorage.app",messagingSenderId:"859830472940",appId:"1:859830472940:web:fa77258b659e1bbe4455c9"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let produtos=[],carrinho=JSON.parse(localStorage.getItem('divinos_cart')||'[]'),filtroCat='todos',filtroSub=null,produtoPreviewAtual=null;
let descontoAvistaPercent=5,parcelasSemJuros=12;
function formatarBR(v){return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function calcAvista(preco, produto=null){
  const p=Number(preco)||0;
  let perc=descontoAvistaPercent;
  if(produto && produto.descontoAvista!=null && produto.descontoAvista!==''){perc=Number(produto.descontoAvista);}
  return {valor:p*(1-perc/100), perc:perc};
}
async function carregarConfigPagamento(){try{const d=await db.collection('config').doc('pagamento').get();if(d.exists){descontoAvistaPercent=Number(d.data().descontoAvista??5);parcelasSemJuros=Number(d.data().parcelas??12);}}catch(e){}}
async function carregarConfigGeral(){try{const d=await db.collection('config').doc('geral').get();if(d.exists&&d.data().heroBg){document.getElementById('heroBg').style.background=`linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 50%, rgba(0,0,0,.2) 100%), url('${d.data().heroBg}') center/cover no-repeat`;}}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function selecionarCatalogo(cat,el){document.querySelectorAll('.catalog-btn').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');filtroCat=cat;filtroSub=null;document.querySelectorAll('.subcatalogs').forEach(s=>s.classList.remove('active'));if(cat==='Console')document.getElementById('subConsoles').classList.add('active');else if(cat==='Jogo')document.getElementById('subJogos').classList.add('active');else if(cat==='Manutenção')document.getElementById('subManutencao').classList.add('active');renderProdutos();}
function filtrarSub(sub,el){if(el){const a=el.classList.contains('active');document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));if(!a){el.classList.add('active');filtroSub=sub;}else filtroSub=null;}renderProdutos();}
function filtrar(){renderProdutos();}
function renderProdutos(){
  const grid=document.getElementById('productsGrid');const busca=document.getElementById('searchInput').value.toLowerCase();
  let lista=produtos.filter(p=>{let ok=true;if(filtroCat!=='todos')ok=p.categoria===filtroCat;if(filtroSub)ok=ok&&((p.subgeneros||[]).includes(filtroSub)||p.nome.toLowerCase().includes(filtroSub.toLowerCase()));if(busca)ok=ok&&(p.nome.toLowerCase().includes(busca)||p.categoria.toLowerCase().includes(busca));return ok;});
  let html='';lista.forEach(p=>{
    const preco=Number(p.preco||0);
    const calc=calcAvista(preco,p);
    const precoAvista=formatarBR(calc.valor);
    const perc=calc.perc;
    const parcela=formatarBR(preco/parcelasSemJuros);
    const badge=(p.emOferta||p.tipo?.includes('OFERTA'))?'<div class="product-badge badge-oferta-dia">OFERTA DO DIA</div>':'';
    const isManut=p.categoria==='Manutenção';
    html+=`<div class="product-card ${p.emOferta?'oferta-topo':''}"><div class="product-img-wrap" onclick="abrirPreviewClient('${p.id}')">${badge}<img src="${p.imagem||''}" class="product-img"></div><div class="product-info" onclick="abrirPreviewClient('${p.id}')"><div class="product-name">${p.nome}</div><div class="product-price">R$ ${formatarBR(preco)}</div><div style="font-size:9px;opacity:.7;margin-top:4px">💰 À Vista R$ ${precoAvista} (${perc}% OFF) • 💳 ${parcelasSemJuros}x R$ ${parcela}</div></div><div class="product-actions"><button class="btn-small btn-buy" onclick="event.stopPropagation();abrirPreviewClient('${p.id}')">${isManut?'💬 Agendar':'🛒 Comprar'}</button><button class="btn-small btn-details" onclick="event.stopPropagation();abrirPreviewClient('${p.id}')">👁️ Ver</button></div></div>`;
  });
  grid.innerHTML=html||'<div style="grid-column:1/-1;text-align:center;opacity:.5;padding:30px">Nenhum produto</div>';document.getElementById('prodCount').textContent=lista.length;
}
function abrirPreviewClient(id){const p=produtos.find(x=>x.id===id);if(!p)return;produtoPreviewAtual=p;const preco=Number(p.preco);const calc=calcAvista(preco,p);document.getElementById('previewClientImg').src=p.imagem||'';document.getElementById('previewClientNome').textContent=p.nome;document.getElementById('previewClientPreco').textContent='R$ '+formatarBR(preco);document.getElementById('previewClientParcela').textContent=`${parcelasSemJuros}x R$ ${formatarBR(preco/parcelasSemJuros)} sem juros`;document.getElementById('previewAvista').textContent=`R$ ${formatarBR(calc.valor)}`;document.getElementById('previewAvistaDesc').textContent=`(${calc.perc}% OFF)`;document.getElementById('previewParcelado').textContent=`${parcelasSemJuros}x R$ ${formatarBR(preco/parcelasSemJuros)}`;document.getElementById('previewModalClient').style.display='flex';}
function fecharPreviewClient(){document.getElementById('previewModalClient').style.display='none';}
function comprarDoPreview(){if(!produtoPreviewAtual)return;const pag=document.querySelector('input[name="pagamentoPreview"]:checked')?.value||'avista';addCarrinho(produtoPreviewAtual.id,pag);fecharPreviewClient();}
function addCarrinho(id,pag){const p=produtos.find(x=>x.id===id);if(!p)return;const e=carrinho.find(x=>x.id===id&&x.pagamento===pag);if(e)e.qtd++;else carrinho.push({...p,qtd:1,pagamento:pag});localStorage.setItem('divinos_cart',JSON.stringify(carrinho));atualizarCarrinho();toast('✅ '+p.nome+' '+pag);}
function atualizarCarrinho(){document.getElementById('cartCount').textContent=carrinho.reduce((s,i)=>s+i.qtd,0);let total=0;carrinho.forEach(i=>{total+=(i.pagamento==='avista'?calcAvista(i.preco,i).valor:i.preco)*i.qtd;});document.getElementById('cartTotal').textContent='R$ '+formatarBR(total);let h='';carrinho.forEach(i=>{const calc=calcAvista(i.preco,i);const final=formatarBR(i.pagamento==='avista'?calc.valor:i.preco);h+=`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff0f"><img src="${i.imagem||''}" style="width:40px;height:40px;border-radius:8px"><div style="flex:1"><div style="font-size:11px">${i.nome} <span style="font-size:8px;background:${i.pagamento==='avista'?'#22c55e20':'#00e5ff20'};border:1px solid ${i.pagamento==='avista'?'#22c55e40':'#00e5ff40'};padding:1px 4px;border-radius:6px">${i.pagamento==='avista'?calc.perc+'% OFF':'Parcelado'}</span></div><div style="font-size:10px;opacity:.6">R$ ${final} x ${i.qtd}</div></div><button onclick="removerCarrinho('${i.id}')">🗑️</button></div>`;});document.getElementById('cartItems').innerHTML=h||'Vazio';}
function removerCarrinho(id){carrinho=carrinho.filter(x=>x.id!==id);localStorage.setItem('divinos_cart',JSON.stringify(carrinho));atualizarCarrinho();}
function abrirCarrinho(){document.getElementById('cartModal').style.display='flex';atualizarCarrinho();}
function fecharCarrinho(){document.getElementById('cartModal').style.display='none';}
function finalizarWhats(){if(!carrinho.length){toast('Vazio');return;}let msg='🎮 DIVINOS GAMES%0A';carrinho.forEach(i=>{const calc=calcAvista(i.preco,i);const final=formatarBR(i.pagamento==='avista'?calc.valor:i.preco);msg+=`${i.nome} - R$ ${final} x ${i.qtd} (${i.pagamento==='avista'?calc.perc+'% OFF':'parcelado'})%0A`;});let total=formatarBR(carrinho.reduce((s,i)=>s+((i.pagamento==='avista'?calcAvista(i.preco,i).valor:i.preco)*i.qtd),0));msg+=`TOTAL R$ ${total}`;window.open('https://wa.me/557399627083?text='+msg,'_blank');}
function zapDoPreview(){if(!produtoPreviewAtual)return;const pag=document.querySelector('input[name="pagamentoPreview"]:checked')?.value||'avista';const calc=calcAvista(produtoPreviewAtual.preco,produtoPreviewAtual);const final=formatarBR(pag==='avista'?calc.valor:produtoPreviewAtual.preco);window.open(`https://wa.me/557399627083?text=Interesse ${produtoPreviewAtual.nome} R$ ${final} ${pag==='avista'?calc.perc+'% OFF':''}`,'_blank');}
function checkSecretAdmin(){const s=document.getElementById('adminSecretPass').value.trim().toLowerCase();if(s==='divinos2024')location.href='admin/index.html?admin=divinos2024';else alert('Senha incorreta');}
let toques=0;document.getElementById('logoDivinos')?.addEventListener('click',()=>{toques++;setTimeout(()=>toques=0,2000);if(toques>=5)document.getElementById('adminSecretModal').style.display='flex';});
async function carregarProdutos(){await carregarConfigPagamento();await carregarConfigGeral();const snap=await db.collection('produtos').get();produtos=[];snap.forEach(d=>produtos.push({id:d.id,...d.data()}));renderProdutos();}
carregarProdutos();atualizarCarrinho();
</script></body></html>

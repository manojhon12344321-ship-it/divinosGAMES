<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divinos GAMES - Loja de Jogos Digitais</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#fff;font-family:'Poppins',sans-serif}
header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid #ffffff10}
.logo{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:700;letter-spacing:2px;cursor:pointer;user-select:none}
.logo span{color:#a855f7}
.banner{padding:60px 5%;text-align:center;background: radial-gradient(circle at 50% 0%, #a855f722, transparent 70%)}
.banner h1{font-family:'Orbitron',sans-serif;font-size:42px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding:20px 5% 80px}
.card{background:#12121f;border:1px solid #ffffff12;border-radius:16px;overflow:hidden;transition:0.3s}
.card:hover{transform:translateY(-5px);border-color:#a855f7}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:15px}
.card h3{font-size:16px;margin-bottom:6px}
.preco{color:#22c55e;font-weight:700;font-size:18px}
.btn{width:100%;margin-top:12px;padding:10px;background:linear-gradient(90deg,#a855f7,#06b6d4);border:none;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}
#adminModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;backdrop-filter:blur(8px)}
.modal-box{background:#18182a;width:90%;max-width:360px;padding:30px;border-radius:20px;border:1px solid #a855f733;text-align:center;animation:pop 0.3s}
@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{margin-bottom:15px;font-family:'Orbitron',sans-serif}
.modal-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f1a;color:#fff;margin-bottom:12px;outline:none}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;padding:11px;border-radius:10px;border:none;cursor:pointer;font-weight:600}
.btn-cancel{background:#222;color:#aaa}
.btn-enter{background:#a855f7;color:#fff}
</style>
</head>
<body>
<header>
<div class="logo" id="logoDivina">DIVINOS<span>GAMES</span></div>
<div style="font-size:12px;color:#666">Loja Oficial</div>
</header>
<div class="banner">
<h1>Os Melhores Jogos</h1>
<p>Entrega imediata via WhatsApp • 100% Original</p>
</div>
<div class="grid" id="gridJogos"></div>

<div id="adminModal">
  <div class="modal-box" id="modalBoxInterna">
    <h2>🔐 Área Restrita</h2>
    <p style="color:#888;font-size:13px;margin-bottom:15px">Digite a senha</p>
    <input type="password" id="inputSenha" placeholder="Senha...">
    <div class="modal-btns">
      <button class="btn-cancel" id="btnFechar">Fechar</button>
      <button class="btn-enter" id="btnEntrar">Entrar</button>
    </div>
    <p style="font-size:11px;color:#555;margin-top:15px">Senha padrão: divinos123</p>
  </div>
</div>

<script>
const jogosPadrao = [
  {id:1, nome:"GTA V - Premium Edition", preco:"29,90", img:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500"},
  {id:2, nome:"FIFA 24 - Original", preco:"39,90", img:"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=500"},
  {id:3, nome:"Red Dead Redemption 2", preco:"49,90", img:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500"},
  {id:4, nome:"Call of Duty MW3", preco:"59,90", img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500"}
];
function carregarJogos(){
  let jogos = JSON.parse(localStorage.getItem('divinos_jogos'));
  if(!jogos) { jogos = jogosPadrao; localStorage.setItem('divinos_jogos', JSON.stringify(jogos)); }
  const grid = document.getElementById('gridJogos');
  grid.innerHTML = jogos.map(j => `
    <div class="card">
      <img src="${j.img}">
      <div class="card-body">
        <h3>${j.nome}</h3>
        <div class="preco">R$ ${j.preco}</div>
        <button class="btn" onclick="comprar('${j.nome}')">Comprar no WhatsApp</button>
      </div>
    </div>
  `).join('');
}
function comprar(nome){
  const zap = "5599999999999";
  const msg = encodeURIComponent(`Olá! Quero comprar: ${nome}`);
  window.open(`https://wa.me/${zap}?text=${msg}`, '_blank');
}
carregarJogos();

let cliques = 0; let ultimoTempo = 0;
const logo = document.getElementById('logoDivina');
const modal = document.getElementById('adminModal');
const modalBox = document.getElementById('modalBoxInterna');
const inputSenha = document.getElementById('inputSenha');

logo.addEventListener('click', (e)=>{
  e.stopPropagation();
  const agora = Date.now();
  if(agora - ultimoTempo > 2000) cliques = 0;
  ultimoTempo = agora; cliques++;
  if(cliques === 5){ cliques = 0; modal.style.display = 'flex'; setTimeout(()=> inputSenha.focus(), 100); }
});
function fecharModal(){ modal.style.display = 'none'; inputSenha.value = ''; cliques = 0; }
modal.addEventListener('click', (e)=>{ if(e.target === modal) fecharModal(); });
modalBox.addEventListener('click', (e)=>{ e.stopPropagation(); });
document.getElementById('btnFechar').addEventListener('click', fecharModal);
document.getElementById('btnEntrar').addEventListener('click', verificarSenha);
inputSenha.addEventListener('keydown', (e)=>{ if(e.key==='Enter') verificarSenha(); });
function verificarSenha(){
  const senha = inputSenha.value.trim();
  const senhaCorreta = localStorage.getItem('divinos_senha') || 'divinos123';
  if(senha === senhaCorreta){ window.location.href = 'admin.html'; }
  else { alert('Senha incorreta!'); inputSenha.value = ''; }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a855f7">
<title>Divinos Games - Loja Mobile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system; -webkit-tap-highlight-color: transparent}
body{background:#0a0a0f;color:#fff;padding-bottom:110px;overflow-x:hidden}
header{background:#111827;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px;letter-spacing:.5px;cursor:pointer}.logo span{color:#a855f7}
.admin-badge{background:#a855f7;padding:4px 10px;border-radius:20px;font-size:11px;display:none}
.search-bar{margin:12px 16px;background:#1f2937;border-radius:12px;display:flex;align-items:center;padding:10px 14px}
.search-bar input{background:transparent;border:none;color:#fff;width:100%;outline:none;font-size:15px}
.hero{padding:0 16px}
.ofertas-top{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 20px #7c3aed44}
.ofertas-top h2{font-size:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#1e293b;border-radius:18px;padding:10px;position:relative;border:1px solid #2a3441}
.card img{width:100%;height:120px;object-fit:contain;background:#0f172a;border-radius:12px}
.card h3{font-size:13px;margin:8px 0 2px;min-height:32px}
.preco{color:#22c55e;font-weight:800;font-size:15px}
.estoque-admin{font-size:11px;background:#000a;padding:4px 7px;border-radius:8px;margin-top:4px;display:none;color:#fbbf24}
.estoque-admin.show{display:block}
.btn-zap{background:#25D366;color:#fff;border:none;padding:11px;width:100%;border-radius:10px;font-weight:800;font-size:13px;margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;cursor:pointer}
.btn-comp{background:#0f172a;color:#cbd5e1;border:1px solid #334155;padding:8px;width:100%;border-radius:10px;font-weight:600;font-size:12px;margin-top:6px;cursor:pointer}
.badge-oferta{position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;z-index:2}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 18px;z-index:40}
.bottom-nav button{background:none;border:none;color:#6b7280;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 18px;border-radius:12px}
.bottom-nav button.active{color:#a855f7;background:#1f2937}
.admin-panel{display:none;position:fixed;inset:0;background:#000e;z-index:100;overflow:auto;padding:14px}
.admin-panel.open{display:block}
.form{background:#1e293b;padding:16px;border-radius:20px;max-width:520px;margin:0 auto;border:1px solid #334155}
.form input,.form select{width:100%;padding:14px;border-radius:12px;border:none;margin:6px 0;background:#0f172a;color:#fff;font-size:15px;border:1px solid #1e293b}
.btn-salvar{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;padding:16px;width:100%;border-radius:14px;font-weight:900;font-size:15px;margin-top:12px;cursor:pointer}
.preview{width:100%;height:190px;object-fit:contain;background:#0f172a;border-radius:12px;margin-top:8px;display:none;border:1px dashed #334155}
.float-wrap{position:fixed;right:14px;bottom:88px;display:flex;flex-direction:column;gap:10px;z-index:45}
.float-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 18px #0008;text-decoration:none;color:#fff}
.float-zap{background:#25D366}.float-insta{background:radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%)}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:12px 20px;border-radius:24px;font-weight:800;display:none;z-index:999}
.chip{font-size:11px;background:#1f2937;border:1px solid #334155;padding:5px 10px;border-radius:20px;display:inline-block;margin:2px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo" id="logoClick">DIVINOS<span>GAMES</span></div>
<div style="display:flex;gap:8px;align-items:center"><div class="admin-badge" id="adminBadge">ADMIN</div><button onclick="document.getElementById('adminPanel').classList.add('open')" style="background:#1f2937;border:none;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px">⚙️ Admin</button></div>
</header>
<div class="search-bar"><span style="opacity:.5;margin-right:8px">🔍</span><input id="busca" placeholder="Buscar playstation, controle, jogo..." oninput="filtrar()"></div>
<div class="hero">
<div class="ofertas-top"><h2>🔥 OFERTAS DO DIA - Toque pra comprar no Zap</h2><div class="grid" id="gridOfertas"></div></div>
<div style="display:flex;gap:8px;margin:10px 0;overflow:auto;padding-bottom:4px" id="filtros">
<button class="chip" onclick="filtroCat('')" style="background:#a855f7;color:#fff;border:none">Todos</button>
<button class="chip" onclick="filtroCat('Console')">Consoles</button>
<button class="chip" onclick="filtroCat('Jogo')">Jogos</button>
<button class="chip" onclick="filtroCat('Controle')">Controles</button>
<button class="chip" onclick="filtroCat('Acessório')">Acessórios</button>
</div>
<h2 style="margin:10px 0 8px;font-size:15px">Todos os produtos <span id="count" style="opacity:.5;font-size:12px"></span></h2>
<div class="grid" id="gridTodos"></div>
</div>
<div class="float-wrap">
<a class="float-btn float-insta" href="https://www.instagram.com/divinosgames?srtk=Nmc4M29yMXIwMmFk" target="_blank">📸</a>
<a class="float-btn float-zap" href="https://wa.me/5573999627083?text=Ol%C3%A1%20Divinos%20Games!%20Vim%20pelo%20site" target="_blank">💬</a>
</div>
<div class="bottom-nav">
<button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span style="font-size:20px">🏠</span>Home</button>
<button onclick="document.getElementById('busca').focus()"><span style="font-size:20px">🔍</span>Buscar</button>
<button onclick="window.open('https://wa.me/5573999627083','_blank')"><span style="font-size:20px">💬</span>Zap</button>
<button onclick="document.getElementById('adminPanel').classList.add('open')"><span style="font-size:20px">⚙️</span>Admin</button>
</div>
<div class="toast" id="toast"></div>
<div class="admin-panel" id="adminPanel">
<div class="form">
<h2 style="font-size:18px">📱 Admin Mobile - Editar tudo</h2>
<p style="font-size:12px;opacity:.7;margin:8px 0 12px">Edite nome, preço, categoria, estoque, foto e tipo. Foto já comprime sozinha.</p>
<input id="nome" placeholder="Nome: ex: Playstation 4" />
<input id="preco" type="number" inputmode="numeric" placeholder="Preço: 2500" />
<select id="categoria"><option value="">Categoria</option><option>Console</option><option>Jogo</option><option>Acessório</option><option>Controle</option></select>
<select id="subcategoria"><option value="">Sub: PlayStation, Xbox...</option><option>PlayStation</option><option>Xbox</option><option>Nintendo</option><option>Outros</option></select>
<select id="tipo"><option value="NORMAL">NORMAL</option><option value="OFERTA DO DIA">🔥 OFERTA DO DIA (vai pro topo)</option></select>
<input id="estoque" type="number" inputmode="numeric" placeholder="Estoque: ex 10 (só você vê)" />
<input id="foto" type="file" accept="image/*" capture="environment" />
<img id="preview" class="preview" />
<button class="btn-salvar" id="btnSalvar">💾 SALVAR - APARECE NA HORA NO SITE</button>
<button id="btnCancelar" onclick="cancelarEdicao()" style="display:none;margin-top:10px;width:100%;padding:14px;border-radius:12px;border:none;background:#e11d48;color:#fff;font-weight:800">❌ Cancelar edição</button>
<button onclick="document.getElementById('adminPanel').classList.remove('open')" style="margin-top:10px;width:100%;padding:14px;border-radius:12px;border:none;background:#0f172a;color:#fff;border:1px solid #334155">Fechar</button>
<div id="listaAdmin" style="margin-top:18px"></div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCUL-tD4pPp7GEExJD08mEHdVzp-fbBxfs",
  authDomain: "divinosgames-63867.firebaseapp.com",
  projectId: "divinosgames-63867",
  storageBucket: "divinosgames-63867.firebasestorage.app",
  messagingSenderId: "859830472940",
  appId: "1:859830472940:web:fa77258b659e1bbe4455c9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let isAdmin=false, clicksLogo=0, imagemBase64="", editandoId=null, todosProdutos=[], filtroAtual="";
document.getElementById('logoClick').addEventListener('click',()=>{
  clicksLogo++; if(clicksLogo>=5){clicksLogo=0; const s=prompt('Senha admin: divinos2024'); if(s==='divinos2024'){isAdmin=true; document.getElementById('adminBadge').style.display='block'; document.getElementById('adminPanel').classList.add('open'); carregarAdminLista(); toast('ADMIN mobile ativo - estoque visível');} else if(s) toast('Senha errada');} setTimeout(()=>clicksLogo=0,3000);
});
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000);}
document.getElementById('foto').addEventListener('change', async(e)=>{const f=e.target.files[0]; if(!f) return; toast('Otimizando foto...'); imagemBase64=await comprimir(f); const p=document.getElementById('preview'); p.src=imagemBase64; p.style.display='block'; toast('✅ Foto pronta!');});
function comprimir(file){return new Promise(res=>{const img=new Image(); img.src=URL.createObjectURL(file); img.onload=()=>{const c=document.createElement('canvas'); const MAX=720; let w=img.width,h=img.height; if(w>h){if(w>MAX){h*=MAX/w;w=MAX;}}else{if(h>MAX){w*=MAX/h;h=MAX;}} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.6));};});}
function filtroCat(cat){filtroAtual=cat; filtrar();}
function filtrar(){const busca=document.getElementById('busca').value.toLowerCase(); let lista=todosProdutos; if(filtroAtual) lista=lista.filter(p=>(p.categoria||'').includes(filtroAtual)); if(busca) lista=lista.filter(p=>(p.nome||'').toLowerCase().includes(busca)); document.getElementById('gridTodos').innerHTML= lista.length? lista.map(cardHTML).join('') : '<p style="opacity:.6;padding:20px;text-align:center">Nenhum produto</p>'; document.getElementById('count').textContent='('+lista.length+')';}
function editarProduto(id){const p=todosProdutos.find(x=>x.id===id); if(!p) return; editandoId=id; document.getElementById('nome').value=p.nome; document.getElementById('preco').value=p.preco; document.getElementById('categoria').value=p.categoria||''; document.getElementById('subcategoria').value=p.subcategoria||''; document.getElementById('tipo').value=p.tipo||'NORMAL'; document.getElementById('estoque').value=p.estoque||0; if(p.imagem){imagemBase64=p.imagem; document.getElementById('preview').src=p.imagem; document.getElementById('preview').style.display='block';} document.getElementById('btnSalvar').textContent='✏️ ATUALIZAR PRODUTO'; document.getElementById('btnCancelar').style.display='block'; toast('Editando '+p.nome);}
function cancelarEdicao(){editandoId=null; imagemBase64=''; document.getElementById('nome').value=''; document.getElementById('preco').value=''; document.getElementById('estoque').value=''; document.getElementById('preview').style.display='none'; document.getElementById('foto').value=''; document.getElementById('btnSalvar').textContent='💾 SALVAR - APARECE NA HORA NO SITE'; document.getElementById('btnCancelar').style.display='none';}
document.getElementById('btnSalvar').addEventListener('click', async()=>{const nome=document.getElementById('nome').value.trim(); const preco=document.getElementById('preco').value.trim(); const cat=document.getElementById('categoria').value; const sub=document.getElementById('subcategoria').value; const tipo=document.getElementById('tipo').value; const estoque=document.getElementById('estoque').value.trim(); if(!nome||!preco){toast('Nome e preço'); return;} const btn=document.getElementById('btnSalvar'); btn.disabled=true; btn.textContent='Salvando...'; try{const dados={nome, preco:Number(preco), categoria:cat, subcategoria:sub, tipo, estoque:Number(estoque||0), imagem: imagemBase64 || document.getElementById('preview').src || '', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()}; if(editandoId){await db.collection('produtos').doc(editandoId).update(dados); toast('✅ Atualizado!');} else{dados.criadoEm=firebase.firestore.FieldValue.serverTimestamp(); await db.collection('produtos').add(dados); toast('✅ Salvo e já no site!');} cancelarEdicao(); carregarProdutos(); carregarAdminLista();}catch(e){alert('Erro: '+e.message);} finally{btn.disabled=false; btn.textContent= editandoId ? '✏️ ATUALIZAR PRODUTO' : '💾 SALVAR - APARECE NA HORA NO SITE';}});
function cardHTML(p){const zap='5573999627083'; const msg=`Olá Divinos Games! 🎮%0AQuero: *${encodeURIComponent(p.nome)}* - R$ ${p.preco}%0ATem estoque?`; return `<div class="card">${p.tipo==='OFERTA DO DIA'?'<div class="badge-oferta">OFERTA</div>':''}<img src="${p.imagem||'https://via.placeholder.com/200?text=Sem+Foto'}" loading="lazy"><h3>${p.nome}</h3><div class="preco">R$ ${p.preco}</div><div class="estoque-admin ${isAdmin?'show':''}">Estoque: ${p.estoque??0}</div><button class="btn-zap" onclick="window.open('https://wa.me/${zap}?text=${msg}','_blank')">🟢 Zap</button><button class="btn-comp" onclick="window.open('https://wa.me/${zap}?text=${encodeURIComponent('Olha '+p.nome)}','_blank')">↗️ Compartilhar</button></div>`;}
async function carregarProdutos(){try{const snap=await db.collection('produtos').orderBy('criadoEm','desc').get(); todosProdutos=[]; const ofertas=[]; snap.forEach(d=>{const o=d.data(); o.id=d.id; todosProdutos.push(o); if(o.tipo==='OFERTA DO DIA') ofertas.push(o);}); document.getElementById('gridOfertas').innerHTML= ofertas.slice(0,3).length? ofertas.slice(0,3).map(cardHTML).join('') : '<p style="opacity:.7">Sem ofertas - marque OFERTA DO DIA</p>'; filtrar();}catch(e){document.getElementById('gridOfertas').innerHTML='<p style="color:#f87171">'+e.message+'</p>';}}
async function carregarAdminLista(){const snap=await db.collection('produtos').orderBy('criadoEm','desc').limit(60).get(); let html='<h3 style="margin-top:10px">📱 Toque em EDITAR pra mudar tudo</h3>'; snap.forEach(doc=>{const d=doc.data(); html+=`<div style="background:#0f172a;padding:12px;border-radius:14px;margin:10px 0;border:1px solid #1e293b"><div style="display:flex;gap:10px;align-items:center"><img src="${d.imagem||''}" style="width:56px;height:56px;object-fit:contain;background:#000;border-radius:10px"><div style="flex:1"><b style="font-size:14px">${d.nome}</b><br><span style="color:#22c55e;font-weight:700">R$${d.preco}</span> <span style="font-size:11px;opacity:.6">${d.tipo==='OFERTA DO DIA'?'🔥':''} Est:${d.estoque??0}</span></div></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="editarProduto('${doc.id}')" style="flex:1;background:#a855f7;border:none;color:#fff;padding:12px;border-radius:10px;font-weight:800">✏️ EDITAR TUDO</button><button onclick="deletar('${doc.id}')" style="background:#ef4444;border:none;color:#fff;padding:12px 16px;border-radius:10px">🗑️</button></div></div>`;}); document.getElementById('listaAdmin').innerHTML=html;}
async function deletar(id){if(confirm('Apagar?')){await db.collection('produtos').doc(id).delete(); toast('Apagado'); carregarProdutos(); carregarAdminLista();}}
carregarProdutos();
</script>
</body>
</html>

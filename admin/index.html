<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - DIVINOS GAMES</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter;background:#080810;color:#fff;padding:14px}
.header-admin{display:flex;justify-content:space-between;align-items:center;background:rgba(18,18,40,.95);border:1px solid #00e5ff30;padding:12px 14px;border-radius:12px;margin-bottom:14px}
.header-admin h1{font-family:Orbitron;font-size:14px;color:#00e5ff}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:12px}
.btn-primary{background:linear-gradient(135deg,#00e5ff,#7c3aed);color:#000}
.btn-danger{background:#1a0a14;border:1px solid #ef444440;color:#ff6b8a}
.card{background:linear-gradient(180deg, rgba(18,18,40,.9) 0%, rgba(10,10,20,.95) 100%);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:14px}
.label{font-size:11px;font-weight:800;color:#8b8ba7;margin:10px 0 4px 2px;text-transform:uppercase;letter-spacing:.5px}
.pro-input,.pro-select{width:100%;background:#0f0f1f;border:1px solid #1f2937;padding:12px;border-radius:10px;color:#fff;outline:none;margin-bottom:8px}
.pro-input:focus,.pro-select:focus{border-color:#00e5ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview-img{width:100%;height:200px;object-fit:contain;background:#000;border-radius:10px;border:1px solid #1f2937;margin-top:8px;display:none}
.lista{display:grid;gap:10px;margin-top:14px}
.prod-item{background:#121228;border:1px solid #ffffff0f;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.prod-item img{width:60px;height:60px;object-fit:contain;background:#000;border-radius:8px}
.login-box{max-width:400px;margin:80px auto;background:#121228;border:1px solid #00e5ff30;border-radius:16px;padding:20px;text-align:center}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <div style="font-family:Orbitron;font-weight:900;color:#00e5ff;font-size:18px;margin-bottom:14px">🎮 ADMIN DIVINOS GAMES</div>
  <input id="loginUser" class="pro-input" placeholder="divinos">
  <input id="loginPass" class="pro-input" type="password" placeholder="••••••">
  <button class="btn btn-primary" style="width:100%;margin-top:12px;padding:12px" onclick="fazerLogin()">🔓 Entrar</button>
  <div style="font-size:10px;opacity:.4;margin-top:12px">divinos / divinos2024</div>
</div>

<div id="adminScreen" style="display:none">
  <div class="header-admin">
    <h1>🎮 DIVINOS GAMES - ADMIN</h1>
    <div style="display:flex;gap:8px">
      <button class="btn" style="background:#11112a;border:1px solid #1f2937;color:#fff" onclick="location.href='../index.html'">🏠 Ver Site</button>
      <button class="btn btn-danger" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="card">
    <div style="font-family:Orbitron;font-weight:900;font-size:13px;margin-bottom:10px">➕ Cadastrar / Editar Produto</div>
    
    <div class="label">Nome do Produto</div>
    <input id="nome" class="pro-input" placeholder="Ex: PS5 Slim ou Limpeza PS5">

    <div class="grid2">
      <div>
        <div class="label">Categoria *</div>
        <select id="categoria" class="pro-select">
          <option value="">Selecione</option>
          <option>Console</option>
          <option>Jogo</option>
          <option>Acessório</option>
          <option>Controle</option>
          <option>Manutenção</option>
        </select>
      </div>
      <div>
        <div class="label">Preço R$</div>
        <input id="preco" class="pro-input" type="number" placeholder="150">
      </div>
    </div>

    <div class="label">Subgêneros / Tags (separar por vírgula)</div>
    <input id="subgeneros" class="pro-input" placeholder="Ex: PS5, Limpeza, Pasta Térmica">

    <div class="label">Imagem</div>
    <input id="imagemFile" class="pro-input" type="file" accept="image/*" onchange="previewImagem(this)">
    <input id="imagem" class="pro-input" placeholder="Cole link https:// ou deixe a foto carregada">
    <img id="preview" class="preview-img">

    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-primary" style="flex:1;padding:14px" onclick="salvarProduto()">💾 SALVAR PRODUTO</button>
      <button class="btn" style="background:#11112a;border:1px solid #1f2937;color:#fff" onclick="limparForm()">🧹 Limpar</button>
    </div>
    <input type="hidden" id="editId">
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-family:Orbitron;font-weight:900;font-size:13px">📦 Produtos (<span id="count">0</span>)</div>
      <button class="btn" style="background:#11112a;border:1px solid #1f2937;color:#fff;padding:6px 10px;font-size:10px" onclick="carregarProdutos()">🔄 Atualizar</button>
    </div>
    <div class="lista" id="listaProdutos"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCUL-tD4pPp7GEExJD08mEHdVzp-fbBxfs",authDomain:"divinosgames-63867.firebaseapp.com",projectId:"divinosgames-63867",storageBucket:"divinosgames-63867.firebasestorage.app",messagingSenderId:"859830472940",appId:"1:859830472940:web:fa77258b659e1bbe4455c9"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function fazerLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  if(u==='divinos' && p==='divinos2024'){
    localStorage.setItem('divinos_admin_logado','1');
    mostrarAdmin();
  }else alert('Login inválido! Use divinos / divinos2024');
}
function mostrarAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminScreen').style.display='block';
  carregarProdutos();
}
function sair(){localStorage.removeItem('divinos_admin_logado');location.reload();}
if(localStorage.getItem('divinos_admin_logado')==='1'){mostrarAdmin();}

function previewImagem(input){
  if(input.files && input.files[0]){
    const r=new FileReader();
    r.onload=function(e){
      document.getElementById('imagem').value=e.target.result;
      const pr=document.getElementById('preview');
      pr.src=e.target.result;
      pr.style.display='block';
    };
    r.readAsDataURL(input.files[0]);
  }
}
document.getElementById('imagem').addEventListener('input',function(){
  if(this.value){
    const pr=document.getElementById('preview');
    pr.src=this.value;
    pr.style.display='block';
  }
});

function limparForm(){
  document.getElementById('nome').value='';
  document.getElementById('categoria').value='';
  document.getElementById('preco').value='';
  document.getElementById('subgeneros').value='';
  document.getElementById('imagem').value='';
  document.getElementById('imagemFile').value='';
  document.getElementById('editId').value='';
  document.getElementById('preview').style.display='none';
}

async function salvarProduto(){
  const nome=document.getElementById('nome').value.trim();
  const categoria=document.getElementById('categoria').value;
  const preco=parseFloat(document.getElementById('preco').value)||0;
  const subgeneros=document.getElementById('subgeneros').value.split(',').map(s=>s.trim()).filter(s=>s);
  const imagem=document.getElementById('imagem').value.trim();
  const editId=document.getElementById('editId').value;
  if(!nome || !categoria || !preco){alert('Preencha Nome, Categoria e Preço!');return;}
  const dados={nome,categoria,preco,subgeneros,imagem,parcela:`12x R$ ${(preco/12).toFixed(2)}`,criado:new Date().toISOString()};
  try{
    if(editId){await db.collection('produtos').doc(editId).update(dados);alert('✅ Atualizado!');}
    else{await db.collection('produtos').add(dados);alert('✅ Cadastrado! Categoria: '+categoria);}
    limparForm();carregarProdutos();
  }catch(e){alert('Erro: '+e.message);}
}

async function carregarProdutos(){
  const lista=document.getElementById('listaProdutos');
  lista.innerHTML='<div style="text-align:center;opacity:.5;padding:20px">Carregando...</div>';
  try{
    const snap=await db.collection('produtos').get();
    let html='';let count=0;
    snap.forEach(doc=>{
      const p=doc.data();count++;
      html+=`<div class="prod-item"><img src="${p.imagem||'https://via.placeholder.com/60x60/0a0f24/00e5ff?text=?'}" onerror="this.src='https://via.placeholder.com/60x60/0a0f24/00e5ff?text=?'"><div style="flex:1"><div style="font-size:12px;font-weight:800">${p.nome}</div><div style="font-size:10px;color:#8b8ba7;margin-top:2px">R$ ${p.preco} • ${p.categoria} • ${(p.subgeneros||[]).join(', ')}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn btn-primary" style="padding:6px 10px;font-size:10px" onclick="editarProduto('${doc.id}')">✏️</button><button class="btn btn-danger" style="padding:6px 10px;font-size:10px" onclick="deletarProduto('${doc.id}')">🗑️</button></div></div>`;
    });
    lista.innerHTML=html||'<div style="text-align:center;opacity:.5;padding:20px">Nenhum produto</div>';
    document.getElementById('count').textContent=count;
  }catch(e){lista.innerHTML='<div style="color:#ef4444">Erro: '+e.message+'</div>';}
}
async function editarProduto(id){
  try{
    const doc=await db.collection('produtos').doc(id).get();
    const p=doc.data();
    document.getElementById('nome').value=p.nome||'';
    document.getElementById('categoria').value=p.categoria||'';
    document.getElementById('preco').value=p.preco||'';
    document.getElementById('subgeneros').value=(p.subgeneros||[]).join(', ');
    document.getElementById('imagem').value=p.imagem||'';
    document.getElementById('editId').value=id;
    if(p.imagem){const pr=document.getElementById('preview');pr.src=p.imagem;pr.style.display='block';}
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){alert(e.message);}
}
async function deletarProduto(id){
  if(!confirm('Deletar esse produto?'))return;
  try{await db.collection('produtos').doc(id).delete();alert('🗑️ Deletado');carregarProdutos();}catch(e){alert(e.message);}
}
</script>
</body>
</html>

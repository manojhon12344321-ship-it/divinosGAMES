<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN V10.1 - DIVINOS GAMES</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter;background:#080810;color:#fff;padding:14px}
.header-admin{display:flex;justify-content:space-between;align-items:center;background:rgba(18,18,40,.95);border:1px solid #00e5ff30;padding:12px 14px;border-radius:12px;margin-bottom:14px}
.header-admin h1{font-family:Orbitron;font-size:14px;color:#00e5ff}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:12px}
.btn-primary{background:linear-gradient(135deg,#00e5ff,#7c3aed);color:#000}
.btn-danger{background:#1a0a14;border:1px solid #ef444440;color:#ff6b8a}
.card{background:linear-gradient(180deg, rgba(18,18,40,.9) 0%, rgba(10,10,20,.95) 100%);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:14px}
.label{font-size:11px;font-weight:800;color:#8b8ba7;margin:10px 0 4px 2px;text-transform:uppercase;letter-spacing:.5px}
.pro-input,.pro-select{width:100%;background:#0f0f1f;border:1px solid #1f2937;padding:12px;border-radius:10px;color:#fff;outline:none;margin-bottom:8px}
.pro-input:focus,.pro-select:focus{border-color:#00e5ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.preview-img{width:100%;height:180px;object-fit:contain;background:#000;border-radius:10px;border:1px solid #1f2937;margin-top:8px;display:none}
.lista{display:grid;gap:10px;margin-top:14px}
.prod-item{background:#121228;border:1px solid #ffffff0f;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.prod-item img{width:60px;height:60px;object-fit:contain;background:#000;border-radius:8px}
.prod-info{flex:1}
.badge-cat{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:900;margin-top:4px}
.badge-cat.manutencao{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000}
.badge-cat.console{background:#00e5ff20;border:1px solid #00e5ff40;color:#00e5ff}
.badge-cat.jogo{background:#a855f720;border:1px solid #a855f740;color:#a855f7}
.badge-oferta{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:900;margin-left:6px}
.login-box{max-width:400px;margin:80px auto;background:#121228;border:1px solid #00e5ff30;border-radius:16px;padding:20px;text-align:center}
.checkbox-row{display:flex;align-items:center;gap:8px;background:#0f0f1f;border:1px solid #1f2937;padding:10px 12px;border-radius:10px;margin:8px 0}
.checkbox-row input{width:18px;height:18px}
</style>
</head>
<body>
<div id="loginScreen" class="login-box">
  <div style="font-family:Orbitron;font-weight:900;color:#00e5ff;font-size:18px;margin-bottom:14px">🎮 ADMIN DIVINOS GAMES V10.1</div>
  <input id="loginUser" class="pro-input" placeholder="divinos"><input id="loginPass" class="pro-input" type="password" placeholder="senha"><button class="btn btn-primary" style="width:100%;margin-top:12px;padding:12px" onclick="fazerLogin()">🔓 Entrar</button>
</div>
<div id="adminScreen" style="display:none">
  <div class="header-admin"><h1>🎮 ADMIN V10.1 - CORRIGIDO</h1><div style="display:flex;gap:8px"><button class="btn" style="background:#11112a;border:1px solid #1f2937;color:#fff" onclick="location.href='../index.html'">🏠 Ver Site</button><button class="btn btn-danger" onclick="sair()">Sair</button></div></div>

  <!-- CONFIG GERAL - ISSO QUE FALTAVA -->
  <div class="card" style="border:1px solid #facc1530">
    <div style="font-family:Orbitron;font-weight:900;font-size:13px;margin-bottom:10px;color:#facc15">⚙️ CONFIG GERAL - Rodapé sem poluição + Hero</div>
    <div class="label">Nome do Rodapé (sem poluição)</div><input id="cfgFooterNome" class="pro-input" placeholder="DIVINOS GAMES">
    <div class="grid2"><div><div class="label">Whats Rodapé</div><input id="cfgFooterWhats" class="pro-input" placeholder="73 9962-7083"></div><div><div class="label">Link Imagem Banner Hero</div><input id="cfgHeroBg" class="pro-input" placeholder="https://..."></div></div>
    <button class="btn" style="background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;width:100%;margin-top:8px;padding:12px" onclick="salvarConfig()">💾 Salvar Config Geral</button>
  </div>

  <div class="card">
    <div style="font-family:Orbitron;font-weight:900;font-size:13px;margin-bottom:10px">➕ Produto / Manutenção 🔧</div>
    <div class="label">Nome</div><input id="nome" class="pro-input" placeholder="Ex: Limpeza Completa PS5">
    <div class="grid2"><div><div class="label">Categoria *</div><select id="categoria" class="pro-select"><option value="">Selecione</option><option>Console</option><option>Jogo</option><option>Acessório</option><option>Controle</option><option>Manutenção</option></select></div><div><div class="label">Preço R$</div><input id="preco" class="pro-input" type="number" placeholder="150"></div></div>
    <div class="grid2"><div><div class="label">Parcela</div><input id="parcela" class="pro-input" placeholder="12x R$ 12,50"></div><div><div class="label">Tipo</div><select id="tipo" class="pro-select"><option value="">Normal</option><option value="OFERTA DO DIA">🔥 OFERTA DO DIA (único amarelo)</option><option value="LANÇAMENTO">LANÇAMENTO</option></select></div></div>
    
    <!-- ISSO QUE FALTAVA - CHECKBOX AMARELO SÓ OFERTA -->
    <div class="checkbox-row"><input type="checkbox" id="emOferta"><label for="emOferta" style="font-size:12px;font-weight:800">🔥 Marcar como OFERTA DO DIA? (fica com borda amarela no site - só marque se for oferta)</label></div>

    <div class="label">Subgêneros / Tags (vírgula)</div><input id="subgeneros" class="pro-input" placeholder="Manutenção: Limpeza, PS5, Pasta Térmica | Console: PS5, SSD 825GB, 4K">
    <div class="label">Imagem</div><input id="imagemFile" class="pro-input" type="file" accept="image/*" capture="environment" onchange="previewImagem(this)"><input id="imagem" class="pro-input" placeholder="https://..."><img id="preview" class="preview-img">
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" style="flex:1;padding:14px" onclick="salvarProduto()">💾 SALVAR</button><button class="btn" style="background:#11112a;border:1px solid #1f2937;color:#fff" onclick="limparForm()">🧹 Limpar</button></div>
    <input type="hidden" id="editId">
  </div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-family:Orbitron;font-weight:900;font-size:13px">📦 Produtos (<span id="count">0</span>) <select id="filtroCat" onchange="carregarProdutos()" style="background:#0f0f1f;border:1px solid #1f2937;color:#fff;padding:4px 8px;border-radius:8px"><option value="todos">Todos</option><option>Console</option><option>Jogo</option><option>Acessório</option><option>Controle</option><option>Manutenção</option></select></div><button class="btn" style="background:#11112a;border:1px solid #1f2937;color:#fff;padding:6px 10px;font-size:10px" onclick="carregarProdutos()">🔄</button></div><div class="lista" id="listaProdutos"></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCUL-tD4pPp7GEExJD08mEHdVzp-fbBxfs",authDomain:"divinosgames-63867.firebaseapp.com",projectId:"divinosgames-63867",storageBucket:"divinosgames-63867.firebasestorage.app",messagingSenderId:"859830472940",appId:"1:859830472940:web:fa77258b659e1bbe4455c9"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function fazerLogin(){const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value.trim();if(u==='divinos'&&p==='divinos2024'){localStorage.setItem('divinos_admin_logado','1');mostrarAdmin();}else alert('Login inválido');}
function mostrarAdmin(){document.getElementById('loginScreen').style.display='none';document.getElementById('adminScreen').style.display='block';carregarProdutos();carregarConfig();}
function sair(){localStorage.removeItem('divinos_admin_logado');location.reload();}
if(localStorage.getItem('divinos_admin_logado')==='1')mostrarAdmin();
function previewImagem(input){if(input.files&&input.files[0]){const r=new FileReader();r.onload=function(e){document.getElementById('imagem').value=e.target.result;const pr=document.getElementById('preview');pr.src=e.target.result;pr.style.display='block';};r.readAsDataURL(input.files[0]);}}
document.getElementById('imagem').addEventListener('input',function(){if(this.value){const pr=document.getElementById('preview');pr.src=this.value;pr.style.display='block';}});
function limparForm(){['nome','categoria','preco','parcela','tipo','subgeneros','imagem','imagemFile','editId'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.getElementById('emOferta').checked=false;document.getElementById('preview').style.display='none';}
async function salvarConfig(){const dados={footerNome:document.getElementById('cfgFooterNome').value.trim(),footerWhats:document.getElementById('cfgFooterWhats').value.trim(),heroBg:document.getElementById('cfgHeroBg').value.trim(),atualizado:new Date().toISOString()};try{await db.collection('config').doc('geral').set(dados,{merge:true});alert('✅ Config salva! Rodapé sem poluição atualizado.');}catch(e){alert(e.message);}}
async function carregarConfig(){try{const doc=await db.collection('config').doc('geral').get();if(doc.exists){const c=doc.data();document.getElementById('cfgFooterNome').value=c.footerNome||'';document.getElementById('cfgFooterWhats').value=c.footerWhats||'';document.getElementById('cfgHeroBg').value=c.heroBg||'';}}catch(e){}}
async function salvarProduto(){const nome=document.getElementById('nome').value.trim();const categoria=document.getElementById('categoria').value;const preco=parseFloat(document.getElementById('preco').value)||0;const parcela=document.getElementById('parcela').value.trim()||`12x R$ ${(preco/12).toFixed(2)}`;const tipo=document.getElementById('tipo').value;const subgeneros=document.getElementById('subgeneros').value.split(',').map(s=>s.trim()).filter(s=>s);const imagem=document.getElementById('imagem').value.trim();const editId=document.getElementById('editId').value;const emOferta=document.getElementById('emOferta').checked || tipo.includes('OFERTA');if(!nome||!categoria||!preco){alert('Nome, Categoria e Preço obrigatórios');return;}const dados={nome,categoria,preco,parcela,tipo,subgeneros,imagem,emOferta,tipoOferta: emOferta?'OFERTA DO DIA':tipo,atualizado:new Date().toISOString()};try{if(editId){await db.collection('produtos').doc(editId).update(dados);alert('✅ Atualizado! '+ (emOferta ? 'Amarelo OFERTA DO DIA' : categoria));}else{dados.criado=new Date().toISOString();await db.collection('produtos').add(dados);alert('✅ Cadastrado! '+categoria+' - '+(emOferta?'OFERTA AMARELA':'Normal'));}limparForm();carregarProdutos();}catch(e){alert(e.message);}}
async function carregarProdutos(){const lista=document.getElementById('listaProdutos');const filtro=document.getElementById('filtroCat').value;lista.innerHTML='<div style="text-align:center;opacity:.5;padding:20px">Carregando...</div>';try{const snap=await db.collection('produtos').orderBy('criado','desc').get();let html='';let count=0;snap.forEach(doc=>{const p=doc.data();if(filtro!=='todos'&&p.categoria!==filtro)return;count++;const catClass=p.categoria==='Manutenção'?'manutencao':p.categoria.toLowerCase();html+=`<div class="prod-item"><img src="${p.imagem||''}"><div class="prod-info"><b>${p.nome}</b> ${p.emOferta?'<span class="badge-oferta">OFERTA DO DIA</span>':''}<small>R$ ${p.preco} - ${p.categoria}</small><div><span class="badge-cat ${catClass}">${p.categoria}</span></div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn btn-primary" style="padding:6px 10px;font-size:10px" onclick="editarProduto('${doc.id}')">✏️</button><button class="btn btn-danger" style="padding:6px 10px;font-size:10px" onclick="deletarProduto('${doc.id}')">🗑️</button></div></div>`;});lista.innerHTML=html||'<div style="text-align:center;opacity:.5">Nenhum</div>';document.getElementById('count').textContent=count;}catch(e){lista.innerHTML=e.message;}}
async function editarProduto(id){try{const doc=await db.collection('produtos').doc(id).get();const p=doc.data();document.getElementById('nome').value=p.nome||'';document.getElementById('categoria').value=p.categoria||'';document.getElementById('preco').value=p.preco||'';document.getElementById('parcela').value=p.parcela||'';document.getElementById('tipo').value=p.tipo||'';document.getElementById('subgeneros').value=(p.subgeneros||[]).join(', ');document.getElementById('imagem').value=p.imagem||'';document.getElementById('emOferta').checked=!!p.emOferta;document.getElementById('editId').value=id;if(p.imagem){const pr=document.getElementById('preview');pr.src=p.imagem;pr.style.display='block';}window.scrollTo({top:0,behavior:'smooth'});}catch(e){alert(e.message);}}
async function deletarProduto(id){if(!confirm('Deletar?'))return;await db.collection('produtos').doc(id).delete();carregarProdutos();}
</script>
</body>
</html>
